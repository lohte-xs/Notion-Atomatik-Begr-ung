<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 600 18px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .box{
      padding: 14px 16px;
      border: 0px solid rgba(127,127,127,0);
      border-radius: 10px;
      background: rgba(238,224,218,1);
      display: inline-block;
      max-width: 720px;
    }
    .sub {
      font-weight: 500;
      opacity: .75;
      font-size: 13px;
      margin-top: 4px !important;
      marging-bottom: 0 !important;
      line-height: 1.25;
    }
    .sub p, .sub div{
      margin: 0 !important;
      padding: 0 !important;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="headline">Heute an der Tagesordnung:</div>
    <div class="sub" id="quote"></div>
  </div>

  <script>
    const quotes = [
      "„Erfolg hat drei Buchstaben: Tun.“ – Johann Wolfgang von Goethe",
      "„In einem Jahr wirst du dir wünschen, du hättest heute angefangen.“ – Karen Lamb",
      "„Mach heute etwas, worauf du morgen stolz sein kannst.“ – Unbekannt",
      "„Carpe diem” - Horaz",
      "„Gib jedem Tag die Chance, der beste deines Lebens zu werden.“ – Mark Twain",
      "„Fokussiere dich auf den nächsten Schritt, nicht auf den ganzen Berg.“ – Unbekannt"
    ];

    let lastIndex = -1;

    function pickQuoteIndex() {
      if (quotes.length <= 1) return 0;
      let i;
      do { i = Math.floor(Math.random() * quotes.length); }
      while (i === lastIndex);
      lastIndex = i;
      return i;
    }

    function setRandomQuote() {
      const el = document.getElementById("quote");
      el.innerHTML = quotes[pickQuoteIndex()];
    }

    setRandomQuote();
    setInterval(setRandomQuote, 60 * 1000); // wechselt alle 60 Sekunden
  </script>
</body>
</html>
