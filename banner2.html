<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font: 600 18px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }
    .box{
      padding: 14px 16px;
      border: 1px solid rgba(127,127,127,.25);
      border-radius: 10px;
      background: rgba(127,127,127,.08);
      display: inline-block;
      max-width: 720px;
    }
    .sub {
      font-weight: 500;
      opacity: .75;
      font-size: 13px;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <div id="headline">Heute an der Tagesordnung:</div>
    <div class="sub" id="quote"></div>
  </div>

  <script>
    const quotes = [
      "„Erfolg hat drei Buchstaben: Tun.“ – Johann Wolfgang von Goethe",
      "„In einem Jahr wirst du dir wünschen, du hättest heute angefangen.“ – Karen Lamb",
      "<br />„Mach heute etwas, worauf du <b>morgen stolz</b> sein kannst.“ – Unbekannt",
      "„Carpe diem” - Horaz",
      "<br />„Gib jedem Tag die Chance, der <b>beste deines Lebens</b> zu werden.“ – Mark Twain",
      "<br />„Fokussiere dich auf den <b>nächsten Schritt</b>, nicht auf den ganzen Berg.“ – Unbekannt"
    ];

    let lastIndex = -1;

    function pickQuoteIndex() {
      if (quotes.length <= 1) return 0;
      let i;
      do { i = Math.floor(Math.random() * quotes.length); }
      while (i === lastIndex);
      lastIndex = i;
      return i;
    }

    function setRandomQuote() {
      const el = document.getElementById("quote");
      el.innerHTML = quotes[pickQuoteIndex()];
    }

    setRandomQuote();
    setInterval(setRandomQuote, 60 * 1000); // wechselt alle 60 Sekunden
  </script>
</body>
</html>
